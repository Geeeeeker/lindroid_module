name: Build LindroidUI Module for Android 14 (AOSP)

on:
  workflow_dispatch:
    inputs:
      aosp_branch:
        description: 'AOSP branch/tag (must match your device ROM, e.g. android-14.0.0_r52)'
        required: true
        default: 'android-14.0.0_r52'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 6144
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      # 只重定向 apt，不碰 TMPDIR
      - name: Redirect APT Cache to Build Volume
        run: |
          BUILD_VOL="${{ github.workspace }}"
          sudo mkdir -p $BUILD_VOL/apt_cache
          echo "Dir::Cache::archives \"$BUILD_VOL/apt_cache\";" | sudo tee /etc/apt/apt.conf.d/99custom
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo chmod 1777 /tmp

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick \
            lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool \
            libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev \
            libwxgtk3.0-gtk3-dev libxml2 libxml2-utils lzop pngcrush \
            rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python3 python-is-python3

      - name: Install Repo
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Initialize & Sync Minimal AOSP Source
        run: |
          cd ${{ github.workspace }}
          mkdir workspace && cd workspace

          repo init --depth=1 --partial-clone \
            -u https://android.googlesource.com/platform/manifest \
            -b ${{ inputs.aosp_branch }} \
            -g "default,-kernel,-device,-emulator,-tests,-docs,-prebuilts_apps,-darwin"

          repo sync -c --no-clone-bundle --no-tags --optimized-fetch \
            --prune --force-sync -j$(nproc)

      - name: Fetch Lindroid Sources (Corrected Branches)
        working-directory: ${{ github.workspace }}/workspace
        run: |
          git clone https://github.com/Linux-on-droid/lindroid-drm-loopback.git vendor/lindroid-drm-loopback
          git clone -b lindroid-21 https://github.com/Linux-on-droid/vendor_lindroid.git vendor/lindroid
          git clone https://github.com/libhybris/libhybris.git external/libhybris

      - name: Apply frameworks/native Patch
        working-directory: ${{ github.workspace }}/workspace
        run: |
          cd frameworks/native
          wget https://github.com/LMODroid/platform_frameworks_native/commit/51b680f33b66e06b18725fdf9a54fa923c14a10b.patch -O lindroid.patch
          git am --keep-cr lindroid.patch || (git apply --reject --whitespace=fix lindroid.patch && echo "Patch applied with rejects, check manually")
          rm lindroid.patch
          cd ../..

      - name: Build LindroidUI
        working-directory: ${{ github.workspace }}/workspace
        run: |
          source build/envsetup.sh
          lunch aosp_arm64-userdebug
          cd vendor/lindroid-drm-loopback/LindroidUI
          mma

      - name: Prepare Artifact
        if: success()
        run: |
          ARTIFACT_DIR=${{ github.workspace }}/lindroid_output
          mkdir -p $ARTIFACT_DIR/system_ext/app/LindroidUI
          mkdir -p $ARTIFACT_DIR/system_ext/lib64

          cp -r ${{ github.workspace }}/workspace/out/target/product/generic_arm64/system/system_ext/app/LindroidUI/* \
                $ARTIFACT_DIR/system_ext/app/LindroidUI/
          cp ${{ github.workspace }}/workspace/out/target/product/generic_arm64/system/system_ext/lib64/libjni_lindroidui.so \
             $ARTIFACT_DIR/system_ext/lib64/
          cp ${{ github.workspace }}/workspace/out/target/product/generic_arm64/system/system_ext/lib64/vendor.lindroid.composer-ndk.so \
             $ARTIFACT_DIR/system_ext/lib64/

          echo "Built from AOSP ${{ inputs.aosp_branch }} | Lindroid branch: lindroid-21" > $ARTIFACT_DIR/build_info.txt

      - name: Upload LindroidUI Module
        uses: actions/upload-artifact@v4
        with:
          name: LindroidUI-Android14-lindroid21
          path: ${{ github.workspace }}/lindroid_output
