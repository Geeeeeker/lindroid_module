name: Build LindroidUI Module for Android 14 (AOSP)

on:
  workflow_dispatch:
    inputs:
      aosp_branch:
        description: 'AOSP branch/tag (e.g. android-14.0.0_r52)'
        required: true
        default: 'android-14.0.0_r52'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Redirect APT Cache to Build Volume
        run: |
          BUILD_VOL="${{ github.workspace }}"
          sudo mkdir -p $BUILD_VOL/apt_cache
          echo "Dir::Cache::archives \"$BUILD_VOL/apt_cache\";" | sudo tee /etc/apt/apt.conf.d/99custom
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo chmod 1777 /tmp

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick \
            lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool \
            libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev \
            libwxgtk3.0-gtk3-dev libxml2 libxml2-utils lzop pngcrush \
            rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python3 python-is-python3

      - name: Install Repo
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

      - name: Initialize AOSP Repo (Exclude all prebuilts)
        working-directory: ${{ github.workspace }}
        run: |
          mkdir workspace && cd workspace
          repo init --depth=1 --partial-clone \
            -u https://android.googlesource.com/platform/manifest \
            -b ${{ inputs.aosp_branch }} \
            -g "default,-kernel,-device,-emulator,-tests,-docs,-prebuilts_apps,-prebuilts,-darwin"

      - name: Remove Known Large / Rate‑Limited Projects
        working-directory: ${{ github.workspace }}/workspace
        run: |
          mkdir -p .repo/local_manifests
          cat > .repo/local_manifests/remove_unused.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <remove-project name="platform/system/nfc"/>
            <remove-project name="platform/prebuilts/rust"/>
            <remove-project name="platform/external/setupcompat"/>
            <remove-project name="platform/sdk"/>
            <remove-project name="platform/external/rust/crates/vhost-user-backend"/>
            <remove-project name="platform/external/rust/crates/virtio-queue"/>
          </manifest>
          EOF

      - name: Check Disk Space Before Sync
        working-directory: ${{ github.workspace }}/workspace
        run: |
          df -h .
          df -i .

      - name: Sync Repo (low concurrency, retry fetches)
        working-directory: ${{ github.workspace }}/workspace
        run: |
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch \
            --force-sync -j2 --retry-fetches=5

      - name: Check Disk Space After Sync
        working-directory: ${{ github.workspace }}/workspace
        run: |
          df -h .
          df -i .

      - name: Clone Essential Prebuilts Manually (skip if exists)
        working-directory: ${{ github.workspace }}/workspace
        env:
          BRANCH: ${{ inputs.aosp_branch }}
        run: |
          echo "Checking and cloning missing prebuilts..."
          declare -A projects=(
            ["prebuilts/clang/host/linux-x86"]="platform/prebuilts/clang/host/linux-x86"
            ["prebuilts/build-tools"]="platform/prebuilts/build-tools"
            ["prebuilts/sdk"]="platform/prebuilts/sdk"
            ["prebuilts/go/linux-x86"]="platform/prebuilts/go/linux-x86"
          )
          for dir in "${!projects[@]}"; do
            if [ -d "$dir" ]; then
              echo "$dir already exists, skipping."
            else
              echo "Cloning $dir..."
              git clone --depth=1 -b $BRANCH "https://android.googlesource.com/${projects[$dir]}" "$dir"
            fi
          done

      - name: Fetch Lindroid Sources
        working-directory: ${{ github.workspace }}/workspace
        run: |
          git clone https://github.com/Linux-on-droid/lindroid-drm-loopback.git vendor/lindroid-drm-loopback
          git clone -b lindroid-21 https://github.com/Linux-on-droid/vendor_lindroid.git vendor/lindroid
          git clone https://github.com/libhybris/libhybris.git external/libhybris

      - name: Apply frameworks/native Patch
        working-directory: ${{ github.workspace }}/workspace
        run: |
          cd frameworks/native
          wget https://github.com/LMODroid/platform_frameworks_native/commit/51b680f33b66e06b18725fdf9a54fa923c14a10b.patch -O lindroid.patch
          # 先用 git am 尝试，失败则用 apply
          git am --keep-cr lindroid.patch || (git apply --reject --whitespace=fix lindroid.patch && echo "Patch applied with apply (check manual if rejects)")
          rm lindroid.patch
          cd ../..

      - name: Build LindroidUI
        working-directory: ${{ github.workspace }}/workspace
        run: |
          source build/envsetup.sh
          lunch sdk_phone_arm64-userdebug
          cd vendor/lindroid-drm-loopback/LindroidUI
          mma

      - name: Prepare Artifact
        if: success()
        run: |
          # 产物路径因 lunch 目标改变而不同，需确认
          # sdk_phone_arm64 产品输出在 out/target/product/emulator_arm64 或 sdk_phone_arm64
          # 我们先尝试查找可能的路径
          cd ${{ github.workspace }}/workspace/out/target/product
          TARGET_DIR=$(ls -d sdk_phone_arm64 emulator_arm64 generic_arm64 2>/dev/null | head -1)
          if [ -z "$TARGET_DIR" ]; then
            echo "Error: Could not find output directory"
            exit 1
          fi
          echo "Using output directory: $TARGET_DIR"
          ARTIFACT_DIR=${{ github.workspace }}/lindroid_output
          mkdir -p $ARTIFACT_DIR/system_ext/app/LindroidUI
          mkdir -p $ARTIFACT_DIR/system_ext/lib64
          cp -r ${{ github.workspace }}/workspace/out/target/product/$TARGET_DIR/system/system_ext/app/LindroidUI/* \
                $ARTIFACT_DIR/system_ext/app/LindroidUI/
          cp ${{ github.workspace }}/workspace/out/target/product/$TARGET_DIR/system/system_ext/lib64/libjni_lindroidui.so \
             $ARTIFACT_DIR/system_ext/lib64/
          cp ${{ github.workspace }}/workspace/out/target/product/$TARGET_DIR/system/system_ext/lib64/vendor.lindroid.composer-ndk.so \
             $ARTIFACT_DIR/system_ext/lib64/
          echo "Built from AOSP ${{ inputs.aosp_branch }} | Lindroid branch: lindroid-21" > $ARTIFACT_DIR/build_info.txt

      - name: Upload LindroidUI Module
        uses: actions/upload-artifact@v4
        with:
          name: LindroidUI-Android14-lindroid21
          path: ${{ github.workspace }}/lindroid_output
